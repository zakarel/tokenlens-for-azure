name: TokenLens for Azure
description: Analyze OpenAI-compatible JSONL traces for avoidable token usage.
inputs:
  input:
    description: Path to an OpenAI-compatible JSONL trace file.
    required: true
  baseline:
    description: Optional baseline JSONL file for regression comparison.
    required: false
  format:
    description: "Report format: text, json, sarif, or html."
    required: false
    default: sarif
  fail-on-regression:
    description: Optional addressable-percentage regression threshold.
    required: false
  python-version:
    description: Python version used by the action.
    required: false
    default: "3.12"
  output-dir:
    description: Directory for the timestamped report.
    required: false
    default: tokenlens-reports
outputs:
  report-path:
    description: Absolute path to the generated timestamped report.
    value: ${{ steps.report.outputs.report-path }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - shell: bash
      id: report
      env:
        TOKENLENS_INPUT: ${{ inputs.input }}
        TOKENLENS_BASELINE: ${{ inputs.baseline }}
        TOKENLENS_FORMAT: ${{ inputs.format }}
        TOKENLENS_FAIL: ${{ inputs.fail-on-regression }}
        TOKENLENS_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        if [[ -n "${TOKENLENS_BASELINE}" ]]; then
          if [[ -n "${TOKENLENS_FAIL}" ]]; then
            tokenlens-azure compare "${TOKENLENS_BASELINE}" "${TOKENLENS_INPUT}" --format "${TOKENLENS_FORMAT}" --output-dir "${TOKENLENS_OUTPUT_DIR}" --fail-on-regression "${TOKENLENS_FAIL}"
          else
            tokenlens-azure compare "${TOKENLENS_BASELINE}" "${TOKENLENS_INPUT}" --format "${TOKENLENS_FORMAT}" --output-dir "${TOKENLENS_OUTPUT_DIR}"
          fi
        else
          tokenlens-azure analyze "${TOKENLENS_INPUT}" --format "${TOKENLENS_FORMAT}" --output-dir "${TOKENLENS_OUTPUT_DIR}"
        fi
        python - <<'PY'
        import os
        from pathlib import Path
        directory = Path(os.environ["TOKENLENS_OUTPUT_DIR"]).resolve()
        files = sorted((path for path in directory.iterdir() if path.is_file()), key=lambda path: path.stat().st_mtime)
        if not files:
            raise SystemExit("TokenLens did not generate a report")
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write(f"report-path={files[-1]}\n")
        PY
