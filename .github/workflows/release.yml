name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m pip install -e ".[dev]"
      - name: Verify tag matches package version
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$expected" = "$actual"
      - run: python -m pytest -q
      - run: python -m build
      - name: Verify built artifacts
        shell: bash
        run: |
          python -m pip install --no-deps dist/*.whl
          tokenlens-azure analyze examples/requests.jsonl --format json --output /tmp/tokenlens-release.json
          test -s /tmp/tokenlens-release.json
          sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: tokenlens-release
          path: dist/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "TokenLens $GITHUB_REF_NAME"
