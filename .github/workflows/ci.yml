name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install -e ".[foundry,foundry-claude,otel,foundry-monitor]"
      - run: pytest
      - name: Reject runtime configuration and private artifacts
        shell: bash
        run: |
          test ! -e .tokenlens.yml
          test ! -e reports
          test ! -e local-traces
          test ! -e foundry-traces
          test ! -e pricing-probe.json
          test ! -e test.py
      - run: tokenlens-azure analyze examples/requests.jsonl --format json --output tokenlens.json
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install built wheel
        run: >-
          python -c "import glob, subprocess, sys;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install',
          '--no-deps', glob.glob('dist/*.whl')[0]])"
      - run: tokenlens-azure doctor
      - name: Verify clean-wheel analysis
        shell: bash
        run: |
          rm -f tokenlens.json
          tokenlens-azure analyze examples/requests.jsonl --format json --output tokenlens.json
          test -s tokenlens.json
