[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenlens-azure"
version = "0.1.0a1"
description = "Offline LLM token-efficiency diagnostics with Azure-first recommendations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TokenLens contributors" }]
dependencies = [
  "PyYAML>=6.0",
  "pydantic>=2.7",
  "rich>=13.7",
  "tiktoken>=0.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
foundry = ["openai>=1.40", "azure-identity>=1.17"]
foundry-claude = ["anthropic>=0.40", "azure-identity>=1.17"]
otel = ["opentelemetry-sdk>=1.27", "opentelemetry-semantic-conventions>=0.48b0"]
foundry-monitor = [
  "azure-identity>=1.17",
  "azure-monitor-querymetrics>=1.0.0b1",
  "azure-monitor-query>=1.2",
  "azure-mgmt-cognitiveservices>=13.5",
  "azure-mgmt-monitor>=6.0",
]

[project.scripts]
tokenlens-azure = "tokenlens.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tokenlens = ["assets/*.png", "assets/*.py", "assets/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
