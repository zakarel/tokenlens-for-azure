[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenlens-azure"
version = "0.1.0a1"
description = "Offline LLM token-efficiency diagnostics with Azure-first recommendations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TokenLens contributors" }]
dependencies = [
  "PyYAML>=6.0",
  "pydantic>=2.7",
  "rich>=13.7",
  "tiktoken>=0.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
tokenlens-azure = "tokenlens.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tokenlens = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
